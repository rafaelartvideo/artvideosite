; Ordered schema: call_history.FIELDS. Numeric timestamps use CDR(field,u).
; Only safe number/identifier characters are persisted. No names, SIP credentials,
; application arguments, userfield, authentication headers, or audio are captured.
[mappings]
union-calls.csv => ${CSV_QUOTE(${FILTER(0-9A-Za-z_.\\-,${CDR(uniqueid)})})},${CSV_QUOTE(${CDR(sequence)})},${CSV_QUOTE(${FILTER(0-9A-Za-z_.\\-,${CDR(linkedid)})})},${CSV_QUOTE(${CDR(start,u)})},${CSV_QUOTE(${CDR(answer,u)})},${CSV_QUOTE(${CDR(end,u)})},${CSV_QUOTE(${FILTER(0-9+*#,${CDR(src)})})},${CSV_QUOTE(${FILTER(0-9+*#,${CDR(dst)})})},${CSV_QUOTE(${FILTER(0-9A-Za-z_./\\-,${CDR(channel)})})},${CSV_QUOTE(${FILTER(0-9A-Za-z_./\\-,${CDR(dstchannel)})})},${CSV_QUOTE(${CDR(disposition)})},${CSV_QUOTE(${CDR(duration)})},${CSV_QUOTE(${CDR(billsec)})}
