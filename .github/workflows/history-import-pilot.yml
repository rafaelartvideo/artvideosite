name: History Import Pilot
on:
  pull_request:
    paths:
      - 'tools/history-import/**'
      - '.github/workflows/history-import-pilot.yml'
permissions:
  contents: read
jobs:
  archive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/history-import/*.test.mjs
