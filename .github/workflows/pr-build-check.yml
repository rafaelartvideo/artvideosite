name: PR Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression tests
        run: npm run test:regressions

      - name: SAC Digital tests
        run: npm run test:sac

      - name: PBX provisioning agent tests
        run: python3 -m unittest discover -s scripts/union-pbx-agent -p 'test_*.py'

      - name: Build
        run: npm run build
