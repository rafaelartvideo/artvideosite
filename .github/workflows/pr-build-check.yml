name: PR Build Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # Nome estavel: configurar como check obrigatorio nas regras da branch main.
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Quality, finance, regressions and SAC tests
        run: npm run test:ci

      - name: PBX provisioning agent tests
        run: python3 -m unittest discover -s scripts/union-pbx-agent -p 'test_*.py'

      - name: Build CRM and public site
        run: npm run build
