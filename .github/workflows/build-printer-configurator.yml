name: Compilar Configurador de Impressoras (Windows)
on:
  push:
    branches: [main]
    paths:
      - 'tools/printer-configurator/**'
      - 'public/assets/crm/impressoras/perfis.json'
      - '.github/workflows/build-printer-configurator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: union-printer-release
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar EXE autocontido
        shell: pwsh
        run: |
          dotnet publish tools/printer-configurator/UnionPrinterConfigurator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o output/printer
          if (!(Test-Path "output/printer/UnionWorld-Configurador.exe")) { throw "EXE nao encontrado." }
      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: UnionWorld-Configurador-Windows
          path: output/printer/UnionWorld-Configurador.exe
          if-no-files-found: error
      - name: Publicar EXE em release estável
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "union-printer-configurator"
          $asset = "output/printer/UnionWorld-Configurador.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --title "Union World - Configurador de Impressoras" --notes "Windows 10/11. Selecione a impressora, escolha o perfil e cadastre o tamanho do papel. Precisa de permissao de administrador. Arquivo sem assinatura digital." --latest=false
          }
