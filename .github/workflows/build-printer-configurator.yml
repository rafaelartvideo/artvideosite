name: Compilar Configurador de Impressoras (Windows)
on:
  push:
    branches: [main]
    paths:
      - 'tools/printer-configurator/**'
      - 'public/assets/crm/impressoras/perfis.json'
      - '.github/workflows/build-printer-configurator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: union-printer-release
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar EXE autocontido
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          dotnet publish tools/printer-configurator/UnionPrinterConfigurator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false "-p:Version=$version" -o output/printer
          if (!(Test-Path "output/printer/UnionWorld-Configurador.exe")) { throw "EXE nao encontrado." }
      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: UnionWorld-Configurador-Windows
          path: output/printer/UnionWorld-Configurador.exe
          if-no-files-found: error
      - name: Publicar EXE em release estável
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "union-printer-configurator"
          $asset = "output/printer/UnionWorld-Configurador.exe"
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          # O campo Label do asset no GitHub Releases guarda a mesma versao
          # gravada no Assembly. A API publica tambem o SHA-256 do binario.
          $versionedAsset = "$asset#$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $versionedAsset --clobber
          } else {
            gh release create $tag $versionedAsset --target $env:GITHUB_SHA --title "Union World - Configurador de Impressoras" --notes "Windows 10/11. Atualizacoes verificadas por versao e SHA-256 do release. A instalacao pede confirmacao; o binario ainda nao tem assinatura Authenticode." --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o executavel versionado." }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $published = $release.assets | Where-Object { $_.name -eq "UnionWorld-Configurador.exe" } | Select-Object -First 1
          if ($null -eq $published -or $published.label -ne $version -or
              $published.digest -notmatch '^sha256:[0-9a-fA-F]{64}
) {
            throw "Release invalido: conferir versao, label e SHA-256 publicados."
          }
