name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Publicar os dois sites mesmo se o build for identico
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Select latest commit
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}
    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 15
      - name: Check latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Commit intermediario: a main ja possui uma versao mais nova."
          fi

  build:
    name: Validate and build once
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-hostgator-build
      cancel-in-progress: true
    outputs:
      crm_hash: ${{ steps.hash.outputs.crm_hash }}
      site_hash: ${{ steps.hash.outputs.site_hash }}
      fresh: ${{ steps.freshness.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi
      - name: Finance domain tests
        run: npm run test:finance
      - name: Regression tests
        run: npm run test:regressions
      - name: SAC Digital tests
        run: npm run test:sac
      - name: Build public site
        run: npm run build:site
      - name: Build CRM
        run: npm run build:crm
      - name: Fingerprint exact build contents
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          release_hash() {
            (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          }
          crm_hash="$(release_hash dist-crm)"
          site_hash="$(release_hash dist-site)"
          echo "crm_hash=$crm_hash" >> "$GITHUB_OUTPUT"
          echo "site_hash=$site_hash" >> "$GITHUB_OUTPUT"
          echo "### Artefatos gerados" >> "$GITHUB_STEP_SUMMARY"
          echo "CRM: $(find dist-crm -type f | wc -l) arquivos; hash $crm_hash" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $(find dist-site -type f | wc -l) arquivos; hash $site_hash" >> "$GITHUB_STEP_SUMMARY"
      - name: Discard obsolete builds before publishing
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Compilacao ultrapassada: nao gerar artefatos nem agendar novos FTPS."
          fi
      - name: Store CRM build
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crm-release
          path: dist-crm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Store public site build
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: dist-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish ${{ matrix.target }}
    needs: [gate, build]
    if: needs.gate.outputs.deploy == 'true' && needs.build.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [crm, site]
    concurrency:
      group: deploy-hostgator-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target }}
      BUILD_HASH: ${{ matrix.target == 'crm' && needs.build.outputs.crm_hash || needs.build.outputs.site_hash }}
      FTP_SERVER: ${{ matrix.target == 'crm' && (secrets.FTP_CRM_SERVER || secrets.FTP_SERVER) || secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ matrix.target == 'crm' && (secrets.FTP_CRM_USERNAME || secrets.FTP_USERNAME) || secrets.FTP_PROD_USERNAME }}
      FTP_PASSWORD: ${{ matrix.target == 'crm' && (secrets.FTP_CRM_PASSWORD || secrets.FTP_PASSWORD) || secrets.FTP_PROD_PASSWORD }}
      FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: dist-${{ matrix.target }}/

      - name: Restore last published fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .deploy-state/${{ matrix.target }}.sha
          key: published-${{ matrix.target }}-lookup-${{ github.run_id }}
          restore-keys: |
            published-${{ matrix.target }}-

      - name: Check latest commit, credentials and content changes
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Credenciais FTPS ausentes para $TARGET."
            exit 0
          fi
          latest_sha="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" | jq -r '.sha')"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Nova versao detectada; nao iniciar envio FTPS antigo."
          elif [ "$FORCE_DEPLOY" != "true" ] && [ -s ".deploy-state/$TARGET.sha" ] && [ "$(cat ".deploy-state/$TARGET.sha")" = "$BUILD_HASH" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Build do $TARGET identico ao ja publicado. Sem envio FTPS."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Publicacao $TARGET necessaria."
          fi

      - name: Restore previous assets
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .current-${{ matrix.target }}-assets
          key: restore-${{ matrix.target }}-assets-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.target }}-assets-

      - name: Preserve new and preceding assets
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".next-$TARGET-assets"
          cp -a "dist-$TARGET/assets/." ".next-$TARGET-assets/"
          if [ -d ".current-$TARGET-assets" ]; then
            cp -an ".current-$TARGET-assets/." "dist-$TARGET/assets/"
          fi
          echo "Publicacao $TARGET: $(find "dist-$TARGET" -type f | wc -l) arquivos com compatibilidade." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish via FTPS
        if: steps.plan.outputs.deploy == 'true'
        id: ftp
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-${{ matrix.target }}/
          server-dir: ./
          timeout: 120000
          log-level: standard
          exclude: &protected_paths |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
            faturasartvideo.com.br/**
            folhaartvideo.com.br/**
            garantiacerta.com/**
            public/**
            public_html/**
            .ftpquota
            .htaccess.no_htaccess.phpupgrader
            .htaccess.phpupgrader.*
            mail_accounts_deletion.log

      - name: Retry FTPS on transient failure
        if: steps.plan.outputs.deploy == 'true' && steps.ftp.outcome == 'failure'
        id: retry
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-${{ matrix.target }}/
          server-dir: ./
          timeout: 120000
          log-level: standard
          exclude: *protected_paths

      - name: Fail if FTPS could not publish
        if: steps.plan.outputs.deploy == 'true' && steps.ftp.outcome == 'failure' && steps.retry.outcome != 'success'
        run: exit 1

      - name: Record successful published files
        if: steps.plan.outputs.deploy == 'true' && (steps.ftp.outcome == 'success' || steps.retry.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ".current-$TARGET-assets"
          mv ".next-$TARGET-assets" ".current-$TARGET-assets"
          mkdir -p .deploy-state
          printf '%s\n' "$BUILD_HASH" > ".deploy-state/$TARGET.sha"
          echo "FTPS $TARGET publicado." >> "$GITHUB_STEP_SUMMARY"

      - name: Cache assets for next publication
        if: steps.plan.outputs.deploy == 'true' && (steps.ftp.outcome == 'success' || steps.retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: .current-${{ matrix.target }}-assets
          key: ${{ matrix.target }}-assets-${{ github.sha }}

      - name: Cache published fingerprint
        if: steps.plan.outputs.deploy == 'true' && (steps.ftp.outcome == 'success' || steps.retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: .deploy-state/${{ matrix.target }}.sha
          key: published-${{ matrix.target }}-${{ github.sha }}

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deploy $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Necessario: ${{ steps.plan.outputs.deploy || 'nao avaliado' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Primeira tentativa: ${{ steps.ftp.outcome || 'ignorada' }}" >> "$GITHUB_STEP_SUMMARY"
