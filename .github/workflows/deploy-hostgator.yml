name: Deploy HostGator

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Select latest commit
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}

    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 15

      - name: Check latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -r '.sha')"

          if [ "${latest_sha}" = "${GITHUB_SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            echo "Este é o commit mais recente da main. O deploy será executado."
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Commit mais novo detectado (${latest_sha}). Este deploy intermediário será ignorado com sucesso."
          fi

  deploy:
    name: deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FTP_CRM_SERVER: ${{ secrets.FTP_CRM_SERVER || secrets.FTP_SERVER }}
      FTP_CRM_USERNAME: ${{ secrets.FTP_CRM_USERNAME || secrets.FTP_USERNAME }}
      FTP_CRM_PASSWORD: ${{ secrets.FTP_CRM_PASSWORD || secrets.FTP_PASSWORD }}
      FTP_PROD_USERNAME: ${{ secrets.FTP_PROD_USERNAME }}
      FTP_PROD_PASSWORD: ${{ secrets.FTP_PROD_PASSWORD }}

    concurrency:
      group: deploy-hostgator-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect deploy targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "crm=true" >> "${GITHUB_OUTPUT}"
            echo "site=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(jq -r '.commits[]? | (.added[]?, .modified[]?, .removed[]?)' "${GITHUB_EVENT_PATH}" | sed '/^$/d' | sort -u)

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "crm=true" >> "${GITHUB_OUTPUT}"
            echo "site=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          site_required=false
          for file in "${changed_files[@]}"; do
            if [[ ! "${file}" =~ ^src/features/(admin-home|admin-shell|audit|dashboard|finance|notifications|partner-companies|pdv|platform-billing|queue-integration|roles|subscriptions|telephony)/ ]]; then
              site_required=true
              break
            fi
          done

          echo "crm=true" >> "${GITHUB_OUTPUT}"
          echo "site=${site_required}" >> "${GITHUB_OUTPUT}"
          echo "Arquivos alterados:"
          printf ' - %s\n' "${changed_files[@]}"
          echo "Build do site público: ${site_required}"

      - name: Restore previous CRM assets
        id: previous_crm_assets
        uses: actions/cache/restore@v4
        with:
          path: .previous-crm-assets
          key: restore-crm-assets-${{ github.run_id }}
          restore-keys: |
            crm-assets-

      - name: Restore previous public site assets
        if: steps.targets.outputs.site == 'true'
        id: previous_site_assets
        uses: actions/cache/restore@v4
        with:
          path: .previous-site-assets
          key: restore-site-assets-${{ github.run_id }}
          restore-keys: |
            site-assets-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Finance domain tests
        run: npm run test:finance

      - name: Error and service-type regression tests
        run: npm run test:regressions

      - name: SAC Digital contract and event tests
        run: npm run test:sac

      - name: Build public site
        if: steps.targets.outputs.site == 'true'
        run: npm run build:site

      - name: Build CRM
        run: npm run build:crm

      - name: Confirm commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -r '.sha')"

          if [ "${latest_sha}" = "${GITHUB_SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Um commit mais novo chegou durante o build. O FTPS desta versão será ignorado."
          fi

      - name: Keep current and previous release assets
        if: steps.current.outputs.deploy == 'true'
        run: |
          rm -rf .current-crm-assets
          mkdir -p .current-crm-assets
          cp -a dist-crm/assets/. .current-crm-assets/

          if [ -d .previous-crm-assets ]; then
            echo "Mantendo os chunks da versão anterior do CRM como janela de compatibilidade."
            cp -an .previous-crm-assets/. dist-crm/assets/
          else
            echo "Nenhum cache anterior de assets do CRM disponível."
          fi

          if [ "${{ steps.targets.outputs.site }}" = "true" ]; then
            rm -rf .current-site-assets
            mkdir -p .current-site-assets
            cp -a dist-site/assets/. .current-site-assets/

            if [ -d .previous-site-assets ]; then
              echo "Mantendo os chunks da versão anterior do site como janela de compatibilidade."
              cp -an .previous-site-assets/. dist-site/assets/
            else
              echo "Nenhum cache anterior de assets do site disponível."
            fi
          fi

      - name: Deploy CRM to unionworld.com.br via FTPS
        if: steps.current.outputs.deploy == 'true'
        id: ftp_crm_deploy
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_CRM_SERVER }}
          username: ${{ env.FTP_CRM_USERNAME }}
          password: ${{ env.FTP_CRM_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-crm/
          server-dir: ./
          timeout: 120000
          log-level: verbose

      - name: Retry CRM deploy after transient failure
        if: steps.current.outputs.deploy == 'true' && steps.ftp_crm_deploy.outcome == 'failure'
        id: ftp_crm_retry
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_CRM_SERVER }}
          username: ${{ env.FTP_CRM_USERNAME }}
          password: ${{ env.FTP_CRM_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-crm/
          server-dir: ./
          timeout: 120000
          log-level: verbose

      - name: Deploy public site to eletronicaartvideo.com.br via FTPS
        if: steps.current.outputs.deploy == 'true' && steps.targets.outputs.site == 'true' && env.FTP_PROD_USERNAME != '' && env.FTP_PROD_PASSWORD != ''
        id: ftp_site_deploy
        continue-on-error: true
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.FTP_PROD_USERNAME }}
          password: ${{ env.FTP_PROD_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-site/
          server-dir: ./
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
            faturasartvideo.com.br/**
            folhaartvideo.com.br/**
            garantiacerta.com/**
            public/**
            public_html/**
            .ftpquota
            .htaccess.no_htaccess.phpupgrader
            .htaccess.phpupgrader.*
            mail_accounts_deletion.log

      - name: Retry public site deploy after transient failure
        if: steps.current.outputs.deploy == 'true' && steps.targets.outputs.site == 'true' && env.FTP_PROD_USERNAME != '' && env.FTP_PROD_PASSWORD != '' && steps.ftp_site_deploy.outcome == 'failure'
        id: ftp_site_retry
        timeout-minutes: 15
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.FTP_PROD_USERNAME }}
          password: ${{ env.FTP_PROD_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist-site/
          server-dir: ./
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
            faturasartvideo.com.br/**
            folhaartvideo.com.br/**
            garantiacerta.com/**
            public/**
            public_html/**
            .ftpquota
            .htaccess.no_htaccess.phpupgrader
            .htaccess.phpupgrader.*
            mail_accounts_deletion.log

      - name: Save current CRM assets for next deploy
        if: steps.current.outputs.deploy == 'true' && (steps.ftp_crm_deploy.outcome == 'success' || steps.ftp_crm_retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: .current-crm-assets
          key: crm-assets-${{ github.sha }}

      - name: Save current public site assets for next deploy
        if: steps.current.outputs.deploy == 'true' && steps.targets.outputs.site == 'true' && (steps.ftp_site_deploy.outcome == 'success' || steps.ftp_site_retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: .current-site-assets
          key: site-assets-${{ github.sha }}
