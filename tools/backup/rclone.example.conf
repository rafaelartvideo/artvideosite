# Copy outside repository; chmod 600. NO real keys in this template.
# Confirm S3 API enabled and endpoint/region in Supabase Storage > S3.
# Restrict network/credential custody; S3 credentials may be highly privileged.
[union-source]
type = s3
provider = Other
access_key_id = REPLACE_OUTSIDE_REPOSITORY
secret_access_key = REPLACE_OUTSIDE_REPOSITORY
endpoint = https://REPLACE_PROJECT_REF.storage.supabase.co/storage/v1/s3
region = REPLACE_FROM_DASHBOARD
force_path_style = true
