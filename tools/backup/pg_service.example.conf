# Copy outside repository; chmod 600. Obtain endpoint from Dashboard > Connect.
# Direct connection or SESSION pooler (not transaction pooler).
[union_backup]
host=REPLACE_WITH_CONFIRMED_HOST
port=5432
dbname=postgres
user=REPLACE_WITH_BACKUP_DATABASE_USER
sslmode=verify-full
# Password belongs in PGPASSFILE, never this file or a connection URI in argv.
# PGPASSFILE format: hostname:port:database:username:password
# Escape backslash and colon according to libpq .pgpass rules.
