# COLE ESTA location DENTRO de um server {} HTTPS EXISTENTE, após
# inspecionar nginx -T. Não cole como arquivo completo isolado:
# a diretiva location não funciona fora de server {}.
# Use no Supabase: https://DOMINIO-HTTPS/union-wuzapi/v1/channel-control
location = /union-wuzapi/v1/channel-control {
    limit_except POST { deny all; }
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:19080/v1/channel-control;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
# NÃO adicione um proxy reverso para http://127.0.0.1:18080 nem
# exponha /admin/users, /session/qr, /dashboard ou /login do WuzAPI.
