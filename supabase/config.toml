project_id = "artvideosite"

# Webhooks externos da Uniq não carregam um JWT do Supabase. A função valida
# um token próprio (UNIQ_WEBHOOK_TOKEN) antes de aceitar qualquer evento.
[functions.uniq-webhook]
verify_jwt = false

# O celular pareado não precisa estar logado no painel. Esta função valida
# manualmente o JWT nas ações do PC e o token temporário do QR nas ações móveis.
[functions.device-capture]
verify_jwt = false

# O checklist móvel usa autenticação manual: JWT no desktop e token temporário no celular.
[functions.order-mobile-checklist]
verify_jwt = false


# O rastreador pareado usa uma credencial própria gerada por QR/código.
# A Edge Function valida essa credencial antes de aceitar coordenadas.
[functions.field-tracking-device]
verify_jwt = false


# Traccar Client/Server não envia JWT do Supabase.
# A função valida o identificador secreto do dispositivo ou o token Bearer da integração.
[functions.field-tracking-traccar]
verify_jwt = false


# Ponte autenticada entre o CRM Union World e o Supabase da Fila.
# O usuário do CRM precisa estar autenticado; as credenciais do segundo projeto ficam apenas no servidor.
[functions.queue-integration]
verify_jwt = true

# SAC API validates Supabase JWT manually; reverse callbacks validate scoped integration tokens.
[functions.sac-digital-api]
verify_jwt = false
[functions.sac-digital-webhook]
verify_jwt = false
[functions.sac-digital-media]
verify_jwt = false
[functions.sac-digital-menu]
verify_jwt = false
# Worker accepts service role or its private scheduler header, validated server-side.
[functions.sac-digital-worker]
verify_jwt = false

# OAuth callback validates a one-time, expiring state bound to user/company/Operator.
[functions.sac-digital-oauth]
verify_jwt = false

